# BACKUP keep-alive only. The primary is the Vercel Cron in vercel.json.
#
# Why: GitHub automatically disables scheduled workflows on public repos after
# 60 days with no repository activity, and pushing new commits does NOT
# re-enable them — it takes a manual click in the Actions tab. That is exactly
# what silently killed this workflow from 2026-09-13 to 2026-10-12 and let the
# Supabase pause warnings start. Never rely on this as the only ping.
name: Supabase Keep-Alive

on:
  schedule:
    # Run daily at 12:00 UTC (7am Central)
    - cron: "0 12 * * *"
  workflow_dispatch: # Allow manual trigger from GitHub UI

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping keep-alive endpoint
        run: |
          response=$(curl -sL -w "\n%{http_code}" \
            -H "Authorization: Bearer ${{ secrets.KEEP_ALIVE_SECRET }}" \
            "${{ secrets.SITE_URL }}/api/keep-alive")

          http_code=$(echo "$response" | tail -n1)
          body=$(echo "$response" | sed '$d')

          echo "Response: $body"
          echo "HTTP Status: $http_code"

          if [ "$http_code" -ne 200 ]; then
            echo "Keep-alive ping failed with status $http_code"
            exit 1
          fi

          echo "✓ Supabase keep-alive successful"
